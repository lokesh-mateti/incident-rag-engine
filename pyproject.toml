[project]
name = "incident-rag-engine"
version = "0.1.0"
description = "RAG-powered incident resolution engine for Cloud/K8s operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langchain>=0.3,<1",
    "langchain-anthropic>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langchain-chroma>=0.2,<1",
    "langchain-huggingface>=0.1,<1",
    "chromadb>=0.5,<1",
    "sentence-transformers>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
rag-cli = "src.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
